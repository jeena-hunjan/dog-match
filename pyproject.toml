[project]
name = "dog-match"
version = "0.1.0"
description = "Recommends dog breeds from a person's lifestyle and, optionally, a photo of a dog they like."
readme = "README.md"
requires-python = ">=3.11,<3.12"
# Core: everything the API service needs at runtime (no PyTorch).
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.30",
    "pydantic>=2.7",
    "pydantic-settings>=2.3",
    "python-multipart>=0.0.9",
    "sqlalchemy>=2.0",
    "alembic>=1.13",
    "psycopg[binary]>=3.2",
    "anthropic>=0.40",
    "prometheus-client>=0.20",
    "pandas>=2.2",
    "rapidfuzz>=3.9",
    "requests>=2.32",
    "pyyaml>=6.0",
]

[dependency-groups]
# ML: training, evaluation and in-app inference. Install with `uv sync --group ml`.
ml = [
    "torch>=2.4",
    "torchvision>=0.19",
    "timm>=1.0",
    "open-clip-torch>=2.26",
    "scikit-learn>=1.5",
    "mlflow>=2.16",
    "matplotlib>=3.9",
]
dev = [
    "pytest>=8.3",
    "pytest-cov>=5.0",
    "httpx>=0.27",
    "ruff>=0.6",
    "mypy>=1.11",
    "pre-commit>=3.8",
    "detect-secrets>=1.5",
    "types-requests",
    "types-pyyaml",
    "pandas-stubs",
    "kaggle>=1.6",
]
pipeline = [
    "scipy>=1.13",
]

[tool.uv]
package = false
default-groups = ["dev", "pipeline"]

# CPU-only PyTorch wheels (keeps the Docker image small; Cloud Run has no GPU).
[[tool.uv.index]]
name = "pytorch-cpu"
url = "https://download.pytorch.org/whl/cpu"
explicit = true

[tool.uv.sources]
torch = { index = "pytorch-cpu" }
torchvision = { index = "pytorch-cpu" }

[tool.ruff]
line-length = 100
target-version = "py311"
extend-exclude = ["migrations"]

[tool.ruff.lint]
select = ["E", "W", "F", "I", "B", "UP", "SIM", "N", "RUF"]

[tool.mypy]
python_version = "3.11"
strict = true
plugins = ["pydantic.mypy"]
exclude = ["^migrations/"]

[[tool.mypy.overrides]]
module = ["timm.*", "open_clip.*", "mlflow.*", "kaggle.*", "scipy.*"]
ignore_missing_imports = true

[tool.pydantic-mypy]
init_forbid_extra = true
init_typed = true
warn_required_dynamic_aliases = true

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
addopts = "-ra"
markers = [
    "slow: model regression tests that need weights (deselect with -m 'not slow')",
]

[tool.coverage.run]
source = ["app"]
omit = ["app/**/__init__.py"]

[tool.coverage.report]
show_missing = true
skip_empty = true
