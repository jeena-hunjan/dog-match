# Name aliases used by pipeline/breed_mapping.py and pipeline/splits.py.
#
# The breed list itself is pipeline/breeds.yaml. Names from other sources are compared
# after normalisation (lowercase, no accents or punctuation, "_" and "-" as spaces,
# "St." as "Saint"), then fuzzy-matched. Only list what that cannot resolve.

# Wild canids: not pets, never recommended (CLAUDE.md section 6).
stanford_excluded: [dingo, dhole, African_hunting_dog]

# Oxford-IIIT Pet dog breed (image-name prefix, e.g. "german_shorthaired_12") ->
# breed name. Oxford is only used as an external test set.
oxford_to_breed:
  german_shorthaired: German Shorthaired Pointer
  great_pyrenees: Pyrenean Mountain Dog
  wheaten_terrier: Soft-coated Wheaten Terrier

# Oxford dog breeds that are not in our breed list. Their images are kept as
# "dog, but not one of our classes" for abstention checks.
oxford_unmapped: [american_bulldog, american_pit_bull_terrier, havanese, shiba_inu]

# Breed name -> TheDogAPI name (TheDogAPI mostly uses FCI/UK names).
breed_to_dog_api:
  Dobermann: Doberman Pinscher
  Groenendael: Belgian Shepherd # TheDogAPI's "Belgian Shepherd" record is the Groenendael
  Miniature Poodle: Poodle (Miniature)
  Standard Poodle: Poodle
  Toy Poodle: Poodle (Toy)
  Xoloitzcuintle: Xoloitzcuintli
